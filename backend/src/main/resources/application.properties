# Server HTTPS & Port Configuration
server.port=${SERVER_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stall_reservation_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# OAuth2 Resource Server (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ASGARDEO_ISSUER_URI:https://api.asgardeo.io/t/org/oauth2/token}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${ASGARDEO_JWK_SET_URI:https://api.asgardeo.io/t/org/oauth2/jwks}

# OAuth2 Client Registration (Asgardeo)
spring.security.oauth2.client.registration.asgardeo.client-id=${ASGARDEO_CLIENT_ID:dummy_client_id}
spring.security.oauth2.client.registration.asgardeo.client-secret=${ASGARDEO_CLIENT_SECRET:dummy_client_secret}
spring.security.oauth2.client.registration.asgardeo.scope=openid,profile,email,groups,roles
spring.security.oauth2.client.registration.asgardeo.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.asgardeo.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 Client Provider (Asgardeo)
spring.security.oauth2.client.provider.asgardeo.issuer-uri=${ASGARDEO_ISSUER_URI:https://api.asgardeo.io/t/org/oauth2/token}
spring.security.oauth2.client.provider.asgardeo.authorization-uri=${ASGARDEO_AUTHORIZATION_URI:${ASGARDEO_ISSUER_URI}/oauth2/authorize}
spring.security.oauth2.client.provider.asgardeo.token-uri=${ASGARDEO_TOKEN_URI:${ASGARDEO_ISSUER_URI}/oauth2/token}
spring.security.oauth2.client.provider.asgardeo.jwk-set-uri=${ASGARDEO_JWK_SET_URI:https://api.asgardeo.io/t/org/oauth2/jwks}
spring.security.oauth2.client.provider.asgardeo.user-info-uri=${ASGARDEO_USER_INFO_URI:${ASGARDEO_ISSUER_URI}/oauth2/userinfo}
spring.security.oauth2.client.provider.asgardeo.user-name-attribute=sub

# JWT Configuration
app.jwtSecret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LXNlY3JldC1rZXktZm9yLXRlc3RpbmctcHVycG9zZXM=}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Embedded Server Limits
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# Application Specific Config
app.frontend.url=${FRONTEND_URL:https://localhost:5173}
app.backend.url=${BACKEND_URL:https://localhost:8443}
file.upload-dir=${FILE_UPLOAD_DIR:uploads/}
app.reservation.max-stalls=${MAX_STALLS:3}

# Pricing Constants (in Cents)
app.pricing.stall.small=${STALL_SMALL_PRICE:500000}
app.pricing.stall.medium=${STALL_MEDIUM_PRICE:1000000}
app.pricing.stall.large=${STALL_LARGE_PRICE:2000000}
app.pricing.vip-multiplier=${VIP_MULTIPLIER:1.2}

# Seeding Credentials
app.seed.admin.username=${SEED_ADMIN_USER:admin}
app.seed.admin.password=${SEED_ADMIN_PASS:admin123}
app.seed.vendor.username=${SEED_VENDOR_USER:vendor}
app.seed.vendor.password=${SEED_VENDOR_PASS:vendor123}
